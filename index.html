<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eso Es — Content Engine</title>
<style>
:root {
  --cream: #F5F0E8;
  --black: #1A1A1A;
  --yellow: #F5C800;
  --red: #E63946;
  --cyan: #00B4D8;
  --green: #2DC653;
  --purple: #7B2FBE;
  --grey: #888;
  --off-white: #FAFAF6;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);font-family:'Courier New',monospace;color:var(--black);min-height:100vh}

/* ── HEADER ── */
header{background:var(--black);color:var(--cream);padding:18px 28px;border-bottom:5px solid var(--yellow);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:100}
.hd-left h1{font-size:20px;font-weight:900;letter-spacing:3px;text-transform:uppercase;line-height:1}
.hd-left span{font-size:10px;color:#666;letter-spacing:1px;margin-top:3px;display:block}
.hd-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hd-btn{border:2px solid #444;padding:7px 13px;font-family:'Courier New',monospace;font-size:10px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:all .15s;background:transparent;color:#aaa}
.hd-btn:hover{border-color:var(--yellow);color:var(--yellow)}
.hd-btn.yellow{background:var(--yellow);color:var(--black);border-color:var(--yellow)}
.hd-btn.yellow:hover{background:#e0b800;border-color:#e0b800}
.hd-btn.red{background:var(--red);color:#fff;border-color:var(--red)}
.present-btn{background:var(--yellow);color:var(--black);border:2px solid var(--yellow);padding:8px 16px;font-family:'Courier New',monospace;font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .15s}
.present-btn:hover{background:transparent;color:var(--yellow)}
body.pm .present-btn{background:var(--red);color:#fff;border-color:var(--red)}

/* ── CONTROLS ── */
.controls{background:#111;padding:10px 28px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #2a2a2a;position:sticky;top:65px;z-index:99}
.filter-btn{background:transparent;color:#777;border:2px solid #333;padding:5px 13px;font-family:'Courier New',monospace;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;cursor:pointer;transition:all .15s}
.filter-btn:hover{border-color:var(--yellow);color:var(--yellow)}
.filter-btn.active{background:var(--yellow);color:var(--black);border-color:var(--yellow)}
.filter-btn.ripple.active{background:var(--cyan);border-color:var(--cyan);color:var(--black)}
.filter-btn.gotcha.active{background:var(--red);border-color:var(--red);color:#fff}
.filter-btn.frother.active{background:var(--green);border-color:var(--green);color:var(--black)}
.filter-btn.wsup.active{background:var(--purple);border-color:var(--purple);color:#fff}
.ctrl-sep{width:1px;height:20px;background:#333;flex-shrink:0}
.view-btn{background:transparent;color:#555;border:2px solid #2a2a2a;padding:5px 11px;font-family:'Courier New',monospace;font-size:10px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all .15s;text-transform:uppercase}
.view-btn:hover,.view-btn.active{border-color:var(--yellow);color:var(--yellow)}

/* ── STATS BAR ── */
.stats-bar{background:#1a1a1a;color:#555;padding:6px 28px;font-size:10px;letter-spacing:1px;display:flex;gap:20px;flex-wrap:wrap;border-bottom:1px solid #222}
.stats-bar strong{color:var(--yellow)}

/* ── GRID ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:28px;padding:28px}
body.pm .grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;padding:20px}
.no-results{grid-column:1/-1;text-align:center;padding:80px;font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:3px;color:var(--grey);display:none}

/* ── BASE CARD ── */
.card{border:3px solid var(--black);box-shadow:6px 6px 0 var(--black);overflow:hidden;background:var(--off-white);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--black)}
.card.hidden{display:none}

/* ── PRODUCT CSS VARS ── */
.card[data-product="Ripple"]{--ac:#00B4D8;--at:var(--black);--ac2:#007A96}
.card[data-product="Gotcha"]{--ac:var(--red);--at:#fff;--ac2:#9C1A24}
.card[data-product="Frother"]{--ac:var(--green);--at:var(--black);--ac2:#1A8A38}
.card[data-product="WSUP"]{--ac:var(--purple);--at:#fff;--ac2:#4A1A8A}
.card[data-product="Brand"]{--ac:var(--yellow);--at:var(--black);--ac2:#C49A00}
.card[data-product="All Products"]{--ac:var(--black);--at:var(--yellow);--ac2:#444}

/* ── CARD VISUAL ── */
.card-visual{position:relative;height:340px;overflow:hidden;border-bottom:3px solid var(--black)}
body.pm .card-visual{border-bottom:none}
body.pm .card-body{display:none}
body.pm .card{cursor:pointer}

.cv-bg{position:absolute;inset:0;z-index:0}
.cv-dots{position:absolute;inset:0;z-index:2;pointer-events:none;background-image:radial-gradient(circle,rgba(0,0,0,.13) 1.5px,transparent 1.5px);background-size:10px 10px}
.cv-stripes{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.055;background-image:repeating-linear-gradient(-45deg,var(--black) 0,var(--black) 10px,transparent 10px,transparent 22px)}
.cv-scanlines{position:absolute;inset:0;z-index:3;pointer-events:none;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 3px,rgba(0,0,0,.07) 3px,rgba(0,0,0,.07) 4px)}
.cv-slash{position:absolute;width:170%;height:90px;left:-35%;z-index:1;background:var(--ac);opacity:.2;transform-origin:center center}
.cv-inner-frame{position:absolute;inset:10px;border:1px solid currentColor;opacity:.12;z-index:3;pointer-events:none}
.cv-stamp{position:absolute;top:13px;left:13px;transform:rotate(-11deg);z-index:10;font-size:9px;font-weight:900;letter-spacing:3px;text-transform:uppercase;padding:2px 7px;border:2px solid currentColor;opacity:.6;line-height:1.5}
.cv-sticker{position:absolute;top:15px;right:-3px;transform:rotate(2.5deg);z-index:10;font-size:10px;font-weight:900;letter-spacing:2px;text-transform:uppercase;padding:5px 16px 5px 11px;border:2px solid var(--black);box-shadow:3px 3px 0 rgba(0,0,0,.25);white-space:nowrap;background:var(--ac);color:var(--at)}
.cv-main{position:absolute;inset:0;bottom:44px;z-index:5;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:52px 22px 10px;text-align:center}
.cv-headline{font-size:30px;font-weight:900;line-height:1.0;text-transform:uppercase;letter-spacing:.5px;word-break:break-word}
.cv-subtext{font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;margin-top:13px;opacity:.72;line-height:1.6}
.cv-cta{position:absolute;bottom:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:10;font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase;border-top:2px solid rgba(0,0,0,.18)}
.cv-cta-arrow{font-size:18px;line-height:1}
.cv-icon{position:absolute;bottom:54px;right:14px;font-size:40px;opacity:.07;z-index:2;transform:rotate(12deg);line-height:1;pointer-events:none}
.cv-overlay{position:absolute;inset:0;background:rgba(0,0,0,.72);color:#fff;font-size:12px;font-weight:900;letter-spacing:4px;text-transform:uppercase;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;z-index:20;pointer-events:none}
body.pm .card:hover .cv-overlay{opacity:1}

/* ── LAYOUTS ── */
.card[data-layout="a"] .cv-bg{background:var(--ac)}
.card[data-layout="a"] .cv-stripes{opacity:.05;background-image:repeating-linear-gradient(-45deg,#fff 0,#fff 10px,transparent 10px,transparent 22px)}
.card[data-layout="a"] .cv-dots{background-image:radial-gradient(circle,rgba(0,0,0,.1) 1.5px,transparent 1.5px)}
.card[data-layout="a"] .cv-slash{display:none}
.card[data-layout="a"] .cv-headline{color:var(--at);text-shadow:3px 3px 0 rgba(0,0,0,.12)}
.card[data-layout="a"] .cv-subtext{color:var(--at)}
.card[data-layout="a"] .cv-stamp{color:var(--at)}
.card[data-layout="a"] .cv-cta{background:var(--black);color:var(--yellow);border-top-color:rgba(255,255,255,.1)}
.card[data-layout="a"] .cv-sticker{background:var(--black);color:var(--yellow);border-color:rgba(0,0,0,.4);box-shadow:3px 3px 0 rgba(0,0,0,.4)}
.card[data-layout="a"] .cv-inner-frame{border-color:var(--at)}

.card[data-layout="b"] .cv-bg{background:var(--cream)}
.card[data-layout="b"] .cv-slash{top:0;height:110px;opacity:1;transform:none}
.card[data-layout="b"] .cv-stripes{display:none}
.card[data-layout="b"] .cv-headline{color:var(--black);font-size:28px}
.card[data-layout="b"] .cv-subtext{color:var(--grey)}
.card[data-layout="b"] .cv-stamp{color:var(--black)}
.card[data-layout="b"] .cv-cta{background:var(--ac);color:var(--at);border-top-color:var(--ac)}
.card[data-layout="b"] .cv-dots{background-image:radial-gradient(circle,rgba(0,0,0,.09) 1.5px,transparent 1.5px)}
.card[data-layout="b"] .cv-inner-frame{border-color:var(--black)}

.card[data-layout="c"] .cv-bg{background:#F6F3EB}
.card[data-layout="c"] .cv-slash{top:50%;height:120px;opacity:.22;transform:translateY(-50%) rotate(-9deg)}
.card[data-layout="c"] .cv-stripes{display:none}
.card[data-layout="c"] .cv-headline{color:var(--black);font-size:26px}
.card[data-layout="c"] .cv-subtext{color:var(--grey)}
.card[data-layout="c"] .cv-stamp{color:var(--black)}
.card[data-layout="c"] .cv-cta{background:var(--black);color:var(--ac);border-top-color:var(--black)}
.card[data-layout="c"] .cv-sticker{background:var(--ac);color:var(--at)}
.card[data-layout="c"] .cv-inner-frame{border-color:var(--black)}

.card[data-layout="d"] .cv-bg{background:#0D0D0D}
.card[data-layout="d"] .cv-dots{background-image:radial-gradient(circle,rgba(255,255,255,.07) 1px,transparent 1px);background-size:8px 8px}
.card[data-layout="d"] .cv-stripes{display:none}
.card[data-layout="d"] .cv-slash{display:none}
.card[data-layout="d"] .cv-headline{color:var(--ac);font-size:26px;text-shadow:0 0 30px var(--ac),0 0 60px rgba(0,0,0,.5)}
.card[data-layout="d"] .cv-subtext{color:#444;letter-spacing:3px}
.card[data-layout="d"] .cv-stamp{color:#3a3a3a;border-color:#3a3a3a;opacity:.9}
.card[data-layout="d"] .cv-cta{background:#111;color:var(--ac);border-top-color:#2a2a2a}
.card[data-layout="d"] .cv-sticker{background:var(--ac);color:var(--at);border-color:rgba(0,0,0,.3)}
.card[data-layout="d"] .cv-inner-frame{border-color:var(--ac);opacity:.15}
.card[data-layout="d"] .cv-icon{opacity:.05;color:var(--ac)}

.card[data-layout="e"] .cv-bg{background:var(--cream)}
.card[data-layout="e"] .cv-slash{top:85%;height:60px;opacity:.18;transform:rotate(-4deg)}
.card[data-layout="e"] .cv-headline{color:var(--black);font-size:32px}
.card[data-layout="e"] .cv-subtext{color:var(--grey)}
.card[data-layout="e"] .cv-stamp{color:var(--black)}
.card[data-layout="e"] .cv-cta{background:var(--yellow);color:var(--black);border-top-color:var(--black)}
.card[data-layout="e"] .cv-sticker{background:var(--black);color:var(--yellow)}
.card[data-layout="e"] .cv-inner-frame{border-color:var(--black)}

/* ── CARD BODY ── */
.card-body{padding:16px 18px 18px;background:var(--off-white)}
.card-title{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-title .num{background:var(--black);color:var(--yellow);font-size:10px;padding:2px 7px;flex-shrink:0}
.card-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.meta-chip{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border:1.5px solid;opacity:.75}
.meta-date{border-color:#bbb;color:#666}
.meta-cat{border-color:var(--ac,#888);color:var(--ac,#888)}
.hook-box{background:#fff7e6;border:2px solid #e8d8b0;border-left:4px solid var(--ac,var(--black));padding:8px 12px;font-size:10px;font-style:italic;line-height:1.65;color:#5a4a2a;margin-bottom:8px;font-weight:700}
.caption-box{background:#fff;border:2px solid #e0dcd4;border-left:4px solid var(--ac,var(--black));padding:10px 12px;font-size:11px;line-height:1.75;white-space:pre-line;max-height:140px;overflow-y:auto;color:#444;margin-bottom:8px}
.caption-box::-webkit-scrollbar{width:3px}
.caption-box::-webkit-scrollbar-thumb{background:#ccc}
.hashtag-line{font-size:9px;color:#999;font-weight:700;margin-bottom:10px;letter-spacing:.5px;line-height:1.5;word-break:break-word}
.prompt-toggle{background:none;border:none;font-family:'Courier New',monospace;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;cursor:pointer;color:#999;margin-bottom:8px;padding:0;display:flex;align-items:center;gap:5px;transition:color .15s}
.prompt-toggle:hover{color:var(--black)}
.prompt-box{display:none;background:#0D0D0D;color:#00FF88;padding:10px 12px;font-size:10px;line-height:1.65;border:2px solid #00FF88;margin-bottom:10px}
.prompt-box.open{display:block}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.copy-btn{background:var(--black);color:var(--cream);border:2px solid var(--black);padding:8px 8px;font-family:'Courier New',monospace;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;cursor:pointer;transition:all .15s;text-align:center;display:block;width:100%}
.copy-btn:hover{background:#333}
.copy-btn.copied{background:var(--green);color:var(--black);border-color:var(--green)}
.copy-prompt-btn{background:transparent;color:var(--black);border-color:var(--black)}
.copy-prompt-btn:hover{background:var(--black);color:var(--cream)}
.copy-prompt-btn.copied{background:var(--green);color:var(--black);border-color:var(--green)}
.status-row{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.status-pill{background:transparent;border:1.5px solid #ccc;color:#aaa;padding:3px 9px;font-family:'Courier New',monospace;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:all .15s}
.status-pill:hover{border-color:#888;color:#888}
.status-pill.active[data-s="Draft"]{background:#555;color:#fff;border-color:#555}
.status-pill.active[data-s="Ready"]{background:var(--yellow);color:var(--black);border-color:var(--yellow)}
.status-pill.active[data-s="Scheduled"]{background:var(--cyan);color:var(--black);border-color:var(--cyan)}
.status-pill.active[data-s="Posted"]{background:var(--green);color:var(--black);border-color:var(--green)}
.card-status-bar{height:4px;width:100%}
.card[data-status="Draft"] .card-status-bar{background:#555}
.card[data-status="Ready"] .card-status-bar{background:var(--yellow)}
.card[data-status="Scheduled"] .card-status-bar{background:var(--cyan)}
.card[data-status="Posted"] .card-status-bar{background:var(--green)}

/* ── CALENDAR VIEW ── */
#calendarView{display:none;padding:28px}
#calendarView.visible{display:block}
.cal-month{margin-bottom:40px}
.cal-month-title{font-size:14px;font-weight:900;letter-spacing:3px;text-transform:uppercase;margin-bottom:14px;padding:10px 16px;background:var(--black);color:var(--yellow);display:inline-block}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-day-label{text-align:center;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:6px 2px;color:var(--grey)}
.cal-day{min-height:90px;border:2px solid #ddd;padding:6px;background:#fff;position:relative;font-size:9px}
.cal-day.empty{background:transparent;border-color:transparent}
.cal-day.today{border-color:var(--yellow)}
.cal-day-num{font-weight:900;font-size:10px;color:#999;margin-bottom:4px}
.cal-post{font-size:8px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:2px 5px;margin-bottom:3px;border:1.5px solid;cursor:pointer;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-post:hover{opacity:.8}

/* ── GENERATE PANEL ── */
.gen-banner{background:#111;border:2px solid #333;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin:0}
.gen-banner-text{font-size:11px;color:#666;letter-spacing:1px}
.gen-banner-text strong{color:var(--yellow);font-size:12px}
.gen-btn{background:var(--purple);color:#fff;border:2px solid var(--purple);padding:9px 18px;font-family:'Courier New',monospace;font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .15s}
.gen-btn:hover{background:transparent;color:var(--purple)}

/* ── MOBILE ── */
@media(max-width:640px){
  header{padding:14px 16px;top:0}
  .hd-left h1{font-size:15px;letter-spacing:2px}
  .hd-left span{display:none}
  .controls{top:54px;padding:8px 14px;gap:5px}
  .filter-btn{font-size:9px;padding:4px 8px}
  .stats-bar{display:none}
  .grid{grid-template-columns:1fr;padding:14px;gap:18px}
  body.pm .grid{grid-template-columns:1fr 1fr;padding:10px;gap:10px}
  .card-visual{height:280px}
  .cv-headline{font-size:22px!important}
  .cv-subtext{font-size:9px}
  .cv-sticker{font-size:9px;padding:4px 12px 4px 8px}
  .hd-btn,.present-btn{font-size:10px;padding:6px 10px}
  .cal-grid{grid-template-columns:repeat(7,1fr)}
  .cal-day{min-height:60px}
}
@media(max-width:380px){
  body.pm .grid{grid-template-columns:1fr}
  .card-visual{height:260px}
}

/* ── POSTING QUEUE ── */
#postingView{display:none;padding:28px}
#postingView.visible{display:block}
.pq-header{background:var(--black);color:var(--cream);padding:16px 20px;margin-bottom:24px}
.pq-header-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.pq-header h2{font-size:11px;font-weight:900;letter-spacing:3px;text-transform:uppercase;margin:0}
.pq-meta-btn{background:var(--yellow);color:var(--black);border:none;padding:7px 14px;font-family:'Courier New',monospace;font-size:10px;font-weight:900;letter-spacing:2px;text-transform:uppercase;cursor:pointer}
.pq-meta-btn:hover{background:#e0b800}
.pq-week{display:flex;gap:4px;flex-wrap:wrap}
.pq-day-slot{flex:1;min-width:80px;padding:8px 10px;border:1.5px solid #333;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;line-height:1.5}
.pq-day-slot .day{color:var(--yellow);display:block;font-size:11px;font-weight:900;margin-bottom:2px}
.pq-day-slot .type{color:#666}
.pq-note{font-size:9px;color:#555;letter-spacing:.5px;margin-top:10px}
.pq-list{display:flex;flex-direction:column;gap:14px}
.pq-card{border:3px solid var(--black);box-shadow:4px 4px 0 var(--black);background:var(--off-white)}
.pq-card.scheduled{border-color:var(--green);box-shadow:4px 4px 0 var(--green)}
.pq-top{background:var(--black);color:var(--cream);padding:9px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pq-num{background:var(--yellow);color:var(--black);font-size:9px;font-weight:900;padding:2px 7px;flex-shrink:0;letter-spacing:1px}
.pq-title{font-size:10px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;flex:1;min-width:80px}
.pq-date{font-size:10px;color:#aaa;white-space:nowrap;font-weight:700}
.pq-slot{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border:1.5px solid #444;color:#888;white-space:nowrap}
.pq-plat{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border:1.5px solid var(--cyan);color:var(--cyan);white-space:nowrap}
.pq-body{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--black)}
.pq-col{padding:12px 14px}
.pq-col:first-child{border-right:2px solid var(--black)}
.pq-col-label{font-size:9px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:#999;margin-bottom:6px}
.pq-caption-text{font-size:11px;line-height:1.75;white-space:pre-line;color:#333;max-height:150px;overflow-y:auto;margin-bottom:6px}
.pq-caption-text::-webkit-scrollbar{width:3px}
.pq-caption-text::-webkit-scrollbar-thumb{background:#ccc}
.pq-hashtags{font-size:9px;color:#999;font-weight:700;letter-spacing:.5px;word-break:break-word;margin-top:4px}
.pq-prompt-text{font-size:10px;line-height:1.65;color:#555;max-height:150px;overflow-y:auto;font-style:italic}
.pq-prompt-text::-webkit-scrollbar{width:3px}
.pq-prompt-text::-webkit-scrollbar-thumb{background:#ccc}
.pq-actions{border-top:2px solid var(--black);padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#f5f2ec}
.pq-btn{background:var(--black);color:var(--cream);border:2px solid var(--black);padding:7px 13px;font-family:'Courier New',monospace;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;cursor:pointer;transition:all .15s}
.pq-btn:hover{background:#333}
.pq-btn.outline{background:transparent;color:var(--black)}
.pq-btn.outline:hover{background:var(--black);color:var(--cream)}
.pq-btn.copied{background:var(--green)!important;color:var(--black)!important;border-color:var(--green)!important}
.pq-sched-btn{margin-left:auto;background:transparent;color:var(--green);border:2px solid var(--green);padding:7px 13px;font-family:'Courier New',monospace;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:1px;cursor:pointer;transition:all .15s;white-space:nowrap}
.pq-sched-btn:hover{background:var(--green);color:var(--black)}
.pq-sched-btn.done{background:var(--green);color:var(--black)}
@media(max-width:700px){
  .pq-body{grid-template-columns:1fr}
  .pq-col:first-child{border-right:none;border-bottom:2px solid var(--black)}
  .pq-week{flex-direction:column}
  .pq-day-slot{flex:none}
  #postingView{padding:12px}
}
</style>
</head>
<body>

<header>
  <div class="hd-left">
    <h1>Eso Es — Content Engine</h1>
    <span id="headerSub">Loading posts… // esoes.com.au</span>
  </div>
  <div class="hd-right">
    <button class="hd-btn" onclick="exportCSV()">↓ Export CSV</button>
    <button class="hd-btn" onclick="exportCanva()">↓ Canva Prompts</button>
    <button class="present-btn" id="presentBtn" onclick="togglePresent()">◼ Present</button>
  </div>
</header>

<div class="controls">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn ripple" data-filter="Ripple">Ripple</button>
  <button class="filter-btn gotcha" data-filter="Gotcha">Gotcha</button>
  <button class="filter-btn frother" data-filter="Frother">Frother</button>
  <button class="filter-btn wsup" data-filter="WSUP">WSUP</button>
  <button class="filter-btn" data-filter="Brand">Brand</button>
  <button class="filter-btn" data-filter="All Products">Multi</button>
  <div class="ctrl-sep"></div>
  <button class="view-btn active" id="viewGrid" onclick="setView('grid')">Grid</button>
  <button class="view-btn" id="viewCal" onclick="setView('calendar')">Calendar</button>
  <button class="view-btn" id="viewPost" onclick="setView('posting')">Ready to Post</button>
</div>

<div class="stats-bar">
  <div>Posts: <strong id="count">—</strong></div>
  <div>Platform: <strong>Instagram + LinkedIn</strong></div>
  <div>Format: <strong>Square / Feed Graphic</strong></div>
  <div>Status: <strong id="statusLabel">Loading…</strong></div>
</div>

<div class="gen-banner">
  <div class="gen-banner-text">
    <strong>GENERATE NEW POSTS</strong> &nbsp;—&nbsp; Run <code>node generate.js</code> to create fresh content via Claude API
  </div>
  <button class="gen-btn" onclick="alert('Run: node generate.js\n\nRequires ANTHROPIC_API_KEY in .env')">⚡ How to Generate</button>
</div>

<div class="grid" id="grid">
  <div class="no-results" id="noResults">No posts match this filter.</div>
</div>

<div id="calendarView"></div>
<div id="postingView"></div>

<script src="data/posts.js"></script>
<script>
const LAYOUTS = ['a','b','c','d','e'];
const ICONS = {'Ripple':'≋','Gotcha':'◎','Frother':'◈','WSUP':'▣','Brand':'◆','All Products':'⊕'};
const PROD_COLORS = {
  'Ripple':'#00B4D8','Gotcha':'#E63946','Frother':'#2DC653',
  'WSUP':'#7B2FBE','Brand':'#F5C800','All Products':'#1A1A1A'
};
const PROD_TEXT = {'Gotcha':'#fff','WSUP':'#fff','All Products':'#F5C800'};

let allPosts = [];

function enc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
function encData(s){ return encodeURIComponent(String(s||'')) }
function formatDate(d){ if(!d) return ''; const [y,m,day]=d.split('-'); return `${day}/${m}/${y}` }

const STATUSES = ['Draft','Ready','Scheduled','Posted'];

function getStatus(num) {
  return localStorage.getItem('esoStatus_'+num) || 'Draft';
}

function setStatus(num, status) {
  localStorage.setItem('esoStatus_'+num, status);
  const card = document.querySelector('.card[data-num="'+num+'"]');
  if (!card) return;
  card.dataset.status = status;
  card.querySelectorAll('.status-pill').forEach(p => p.classList.toggle('active', p.dataset.s === status));
}

function buildCard(p) {
  const layout = LAYOUTS[(p.num - 1) % 5];
  const icon = ICONS[p.product] || '◆';
  const n = String(p.num).padStart(2,'0');
  const caption = p.caption || '';
  const prompt = p.image_prompt || p.prompt || '';
  const hook = p.hook || '';
  const hashtags = p.hashtags || '';
  const cta = p.cta || '';
  const category = p.category || '';
  const date = p.date || '';
  const status = getStatus(p.num);
  return `<div class="card" data-product="${enc(p.product)}" data-num="${p.num}" data-layout="${layout}"
    data-status="${status}"
    data-caption="${encData(caption)}" data-prompt="${encData(prompt)}"
    data-cta="${encData(cta)}" data-hashtags="${encData(hashtags)}">
  <div class="card-visual">
    <div class="cv-bg"></div>
    <div class="cv-dots"></div>
    <div class="cv-stripes"></div>
    <div class="cv-slash"></div>
    <div class="cv-scanlines"></div>
    <div class="cv-inner-frame"></div>
    <div class="cv-stamp">POST ${n}</div>
    <div class="cv-sticker">${enc(p.product)}</div>
    <div class="cv-main">
      <div class="cv-headline">${enc(p.headline)}</div>
      <div class="cv-subtext">${enc(p.subtext)}</div>
    </div>
    <div class="cv-icon">${icon}</div>
    <div class="cv-cta">
      <span>${enc(cta)}</span>
      <span class="cv-cta-arrow">→</span>
    </div>
    <div class="cv-overlay">VIEW POST</div>
  </div>
  <div class="card-body">
    <div class="card-status-bar"></div>
    <div class="card-title"><span class="num">#${n}</span>${enc(p.title)}</div>
    <div class="card-meta">
      ${date ? `<span class="meta-chip meta-date">${formatDate(date)}</span>` : ''}
      ${category ? `<span class="meta-chip meta-cat">${enc(category)}</span>` : ''}
    </div>
    ${hook ? `<div class="hook-box">"${enc(hook)}"</div>` : ''}
    <div class="caption-box">${enc(caption)}</div>
    ${hashtags ? `<div class="hashtag-line">${enc(hashtags)}</div>` : ''}
    <button class="prompt-toggle" onclick="togglePrompt(this)">▶ Canva Image Prompt</button>
    <div class="prompt-box">${enc(prompt)}</div>
    <div class="btn-row">
      <button class="copy-btn" onclick="copyCaption(this)">Copy Caption</button>
      <button class="copy-btn copy-prompt-btn" onclick="copyPrompt(this)">Copy Image Prompt</button>
    </div>
    <div class="status-row">
      ${STATUSES.map(s => `<button class="status-pill${status===s?' active':''}" data-s="${s}" onclick="setStatus(${p.num},'${s}')">${s}</button>`).join('')}
    </div>
  </div>
</div>`;
}

function renderCards(posts) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '<div class="no-results" id="noResults">No posts match this filter.</div>';
  posts.forEach(p => grid.insertAdjacentHTML('beforeend', buildCard(p)));
  attachFilters();
}

function attachFilters() {
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const filter = btn.dataset.filter;
      const cards = document.querySelectorAll('.card');
      let visible = 0;
      cards.forEach(card => {
        const match = filter === 'all' || card.dataset.product === filter;
        card.classList.toggle('hidden', !match);
        if (match) visible++;
      });
      document.getElementById('count').textContent = visible;
      const nr = document.getElementById('noResults');
      if (nr) nr.style.display = visible === 0 ? 'block' : 'none';
    });
  });
}

function togglePrompt(btn) {
  const box = btn.nextElementSibling;
  box.classList.toggle('open');
  btn.textContent = box.classList.contains('open') ? '▼ AI Visual Prompt' : '▶ AI Visual Prompt';
}

function copyCaption(btn) {
  const card = btn.closest('.card');
  const caption = decodeURIComponent(card.dataset.caption || '');
  const hashtags = decodeURIComponent(card.dataset.hashtags || '');
  const parts = [caption];
  if (hashtags) parts.push(hashtags);
  copyText(btn, parts.join('\n\n'));
}

function copyPrompt(btn) {
  const card = btn.closest('.card');
  copyText(btn, decodeURIComponent(card.dataset.prompt || ''));
}

function copyText(btn, text) {
  const orig = btn.textContent;
  const done = () => flash(btn, orig);
  navigator.clipboard.writeText(text).then(done).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); done();
  });
}

function flash(btn, orig) {
  btn.textContent = '✓ Copied!'; btn.classList.add('copied');
  setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 2200);
}

function togglePresent() {
  document.body.classList.toggle('pm');
  const btn = document.getElementById('presentBtn');
  btn.textContent = document.body.classList.contains('pm') ? '✕ Exit' : '◼ Present';
  document.querySelectorAll('.card').forEach(card => {
    card.onclick = () => {
      if (document.body.classList.contains('pm')) {
        document.body.classList.remove('pm');
        btn.textContent = '◼ Present';
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    };
  });
}

/* ── VIEWS ── */
function setView(view) {
  document.getElementById('viewGrid').classList.toggle('active', view === 'grid');
  document.getElementById('viewCal').classList.toggle('active', view === 'calendar');
  document.getElementById('viewPost').classList.toggle('active', view === 'posting');
  document.getElementById('grid').style.display = view === 'grid' ? '' : 'none';
  const calView = document.getElementById('calendarView');
  const postView = document.getElementById('postingView');
  if (view === 'calendar') {
    calView.classList.add('visible'); postView.classList.remove('visible');
    if (!calView.dataset.built) { buildCalendar(); calView.dataset.built = '1'; }
  } else if (view === 'posting') {
    calView.classList.remove('visible'); postView.classList.add('visible');
    if (!postView.dataset.built) { buildPostingQueue(); postView.dataset.built = '1'; }
  } else {
    calView.classList.remove('visible'); postView.classList.remove('visible');
  }
}

/* ── CALENDAR ── */
function buildCalendar() {
  const calView = document.getElementById('calendarView');
  const byDate = {};
  allPosts.forEach(p => {
    if (p.date) { byDate[p.date] = byDate[p.date] || []; byDate[p.date].push(p); }
  });

  const months = [{y:2026,m:7},{y:2026,m:8}];
  const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  let html = '';
  months.forEach(({y, m}) => {
    const monthName = new Date(y, m-1, 1).toLocaleString('default', {month:'long'});
    const firstDay = new Date(y, m-1, 1).getDay();
    const daysInMonth = new Date(y, m, 0).getDate();
    html += `<div class="cal-month">
      <div class="cal-month-title">${monthName} ${y}</div>
      <div class="cal-grid">
        ${DAYS.map(d => `<div class="cal-day-label">${d}</div>`).join('')}
        ${Array(firstDay).fill('<div class="cal-day empty"></div>').join('')}`;
    for (let d = 1; d <= daysInMonth; d++) {
      const key = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dayPosts = byDate[key] || [];
      const today = new Date(); const isToday = today.getFullYear()===y && today.getMonth()===m-1 && today.getDate()===d;
      html += `<div class="cal-day${isToday?' today':''}">
        <div class="cal-day-num">${d}</div>
        ${dayPosts.map(p => {
          const bg = PROD_COLORS[p.product] || '#888';
          const fg = PROD_TEXT[p.product] || '#000';
          return `<div class="cal-post" style="background:${bg};color:${fg};border-color:${bg}" title="${p.title}">${p.product} #${p.num}</div>`;
        }).join('')}
      </div>`;
    }
    html += '</div></div>';
  });
  calView.innerHTML = html;
}

/* ── POSTING QUEUE ── */
const DAY_SLOTS = {1:'Brand Leak',2:'Gotcha',3:'WSUP',4:'Ripple / Frother',5:'Founder / Local'};
const LI_CATS = ['Brand Story','Founder Post','Educational','Audience','Brand Voice'];
const WEEK_SCHEDULE = [['MON','Brand Leak'],['TUE','Gotcha'],['WED','WSUP'],['THU','Ripple / Frother'],['FRI','Founder / Local']];

function getPlatform(p) {
  return LI_CATS.includes(p.category) ? 'Instagram + LinkedIn' : 'Instagram';
}

function getDaySlot(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  return DAY_SLOTS[d.getDay()] || '';
}

function formatDateLong(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-AU', {weekday:'short',day:'numeric',month:'short',year:'2-digit'});
}

function buildPostingQueue() {
  const postView = document.getElementById('postingView');
  const sorted = [...allPosts].sort((a,b) => (a.date||'').localeCompare(b.date||''));

  const headerHtml = `<div class="pq-header">
    <div class="pq-header-top">
      <h2>Weekly Posting Schedule</h2>
      <button class="pq-meta-btn" onclick="window.open('https://business.facebook.com','_blank')">↗ Open Meta Business Suite</button>
    </div>
    <div class="pq-week">
      ${WEEK_SCHEDULE.map(([day,type]) => `<div class="pq-day-slot"><span class="day">${day}</span><span class="type">${type}</span></div>`).join('')}
    </div>
    <div class="pq-note">Copy caption + image prompt below, then paste into Meta Business Suite to schedule each post manually.</div>
  </div>`;

  const cardsHtml = sorted.map(p => {
    const n = String(p.num).padStart(2,'0');
    const caption = p.caption || '';
    const hashtags = p.hashtags || '';
    const prompt = p.image_prompt || p.prompt || '';
    const platform = getPlatform(p);
    const slot = getDaySlot(p.date);
    const dateLong = formatDateLong(p.date);
    const isScheduled = localStorage.getItem('esoSched_'+p.num) === '1';
    const fullCaption = caption + (hashtags ? '\n\n' + hashtags : '');
    return `<div class="pq-card${isScheduled?' scheduled':''}" id="pqcard-${p.num}"
      data-caption="${encData(fullCaption)}" data-prompt="${encData(prompt)}">
      <div class="pq-top">
        <span class="pq-num">#${n}</span>
        <span class="pq-title">${enc(p.title)}</span>
        <span class="pq-date">${dateLong}</span>
        ${slot ? `<span class="pq-slot">${slot}</span>` : ''}
        <span class="pq-plat">${platform}</span>
      </div>
      <div class="pq-body">
        <div class="pq-col">
          <div class="pq-col-label">Final Caption</div>
          <div class="pq-caption-text">${enc(caption)}</div>
          ${hashtags ? `<div class="pq-hashtags">${enc(hashtags)}</div>` : ''}
        </div>
        <div class="pq-col">
          <div class="pq-col-label">Canva Image Prompt</div>
          <div class="pq-prompt-text">${enc(prompt)}</div>
        </div>
      </div>
      <div class="pq-actions">
        <button class="pq-btn" onclick="pqCopy(this,'caption')">Copy Caption</button>
        <button class="pq-btn outline" onclick="pqCopy(this,'prompt')">Copy Image Prompt</button>
        <button class="pq-sched-btn${isScheduled?' done':''}" id="schbtn-${p.num}" onclick="toggleScheduled(${p.num})">${isScheduled?'✓ Scheduled':'Mark as Scheduled'}</button>
      </div>
    </div>`;
  }).join('');

  postView.innerHTML = headerHtml + `<div class="pq-list">${cardsHtml}</div>`;
}

function pqCopy(btn, field) {
  const card = btn.closest('.pq-card');
  const text = decodeURIComponent(card.dataset[field]);
  const orig = btn.textContent;
  navigator.clipboard.writeText(text).then(() => flashPq(btn, orig)).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); flashPq(btn, orig);
  });
}

function flashPq(btn, orig) {
  btn.textContent = '✓ Copied!'; btn.classList.add('copied');
  setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 2200);
}

function toggleScheduled(num) {
  const key = 'esoSched_' + num;
  const isNow = localStorage.getItem(key) === '1';
  if (isNow) localStorage.removeItem(key); else localStorage.setItem(key,'1');
  document.getElementById('pqcard-'+num).classList.toggle('scheduled', !isNow);
  const btn = document.getElementById('schbtn-'+num);
  btn.textContent = !isNow ? '✓ Scheduled' : 'Mark as Scheduled';
  btn.classList.toggle('done', !isNow);
}

/* ── EXPORT CSV ── */
function csvCell(v) {
  const s = String(v || '').replace(/\n/g, ' ').replace(/\r/g, '');
  if (s.includes(',') || s.includes('"') || s.includes('\n')) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function exportCSV() {
  const visible = allPosts.filter(p => {
    const card = document.querySelector(`.card[data-num="${p.num}"]`);
    return card && !card.classList.contains('hidden');
  });
  const cols = ['date','product','category','headline','hook','caption','cta','graphic_concept','image_prompt','hashtags'];
  const rows = [cols.join(',')];
  visible.forEach(p => {
    rows.push(cols.map(c => csvCell(p[c] || p.prompt || '')).join(','));
  });
  download('eso-es-posts.csv', rows.join('\n'), 'text/csv');
}

/* ── EXPORT CANVA PROMPTS ── */
function exportCanva() {
  const visible = allPosts.filter(p => {
    const card = document.querySelector(`.card[data-num="${p.num}"]`);
    return card && !card.classList.contains('hidden');
  });
  const cols = ['num','product','headline','image_prompt'];
  const rows = [cols.join(',')];
  visible.forEach(p => {
    rows.push(cols.map(c => csvCell(p[c] || p.prompt || '')).join(','));
  });
  download('eso-es-canva-prompts.csv', rows.join('\n'), 'text/csv');
}

function download(filename, content, type) {
  const blob = new Blob([content], {type});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ── LOAD POSTS ── */
function initPosts(posts, source) {
  allPosts = posts;
  const n = allPosts.length;
  document.getElementById('count').textContent = n;
  document.getElementById('headerSub').textContent = `${n} Posts Ready // esoes.com.au // Instagram + LinkedIn`;
  document.getElementById('statusLabel').textContent = 'All Ready';
  document.querySelector('.filter-btn[data-filter="all"]').textContent = `All (${n})`;
  console.log('[eso-es] Loaded ' + n + ' posts (source: ' + source + ')');
  renderCards(allPosts);
}

async function loadPosts() {
  /* 1 — external posts.js script tag ran synchronously before this script */
  if (window.POSTS_DATA && window.POSTS_DATA.length > 0) {
    console.log('[eso-es] fetch URL: posts.js (script tag) | response status: 200 | posts loaded:', window.POSTS_DATA.length);
    return initPosts(window.POSTS_DATA, 'posts.js');
  }

  /* 2 — file:// protocol: fetch is blocked, use embedded data immediately */
  if (location.protocol === 'file:') {
    console.log('[eso-es] fetch URL: N/A | response status: N/A (file:// blocked) | posts loaded:', EMBEDDED_POSTS.length);
    console.log('[eso-es] Switched to embedded data mode');
    return initPosts(EMBEDDED_POSTS, 'embedded');
  }

  /* 3 — served over http(s): try fetch, fall back to embedded on error */
  const url = './data/posts.json';
  document.getElementById('statusLabel').textContent = 'Loading...';
  console.log('[eso-es] fetch URL:', url);
  try {
    const res = await fetch(url);
    console.log('[eso-es] response status:', res.status);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const posts = await res.json();
    console.log('[eso-es] posts loaded:', posts.length);
    initPosts(posts, 'fetch');
  } catch (err) {
    console.error('[eso-es] Error loading posts:', err.message, '— using embedded data');
    document.getElementById('statusLabel').textContent = 'Error loading posts';
    initPosts(EMBEDDED_POSTS, 'embedded-fallback');
  }
}

loadPosts();
</script>
