<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eso Es — Auto Poster</title>
<style>
:root {
  --bg: #0d0d0d; --surface: #1a1a1a; --surface2: #222;
  --border: #2a2a2a; --accent: #e8e8e8; --muted: #666;
  --green: #22c55e; --amber: #f59e0b; --blue: #3b82f6;
  --purple: #a855f7; --red: #ef4444; --cyan: #06b6d4;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--accent); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; }

/* ── Header ── */
header { padding: 16px 28px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--bg); z-index: 20; }
header h1 { font-size: 16px; font-weight: 800; letter-spacing: 0.08em; }
.header-actions { display: flex; gap: 8px; }

/* ── Dashboard ── */
.dashboard { display: flex; gap: 1px; background: var(--border); border-bottom: 1px solid var(--border); position: sticky; top: 49px; z-index: 19; }
.stat { flex: 1; background: var(--bg); padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; }
.stat-num { font-size: 22px; font-weight: 800; line-height: 1; }
.stat-label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.stat-posts    .stat-num { color: var(--accent); }
.stat-ready    .stat-num { color: var(--green); }
.stat-gen      .stat-num { color: var(--amber); }
.stat-approved .stat-num { color: var(--blue); }
.stat-sched    .stat-num { color: var(--purple); }
.stat-posted   .stat-num { color: var(--muted); }

/* ── Controls ── */
.controls { padding: 12px 28px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--border); background: var(--bg); position: sticky; top: 97px; z-index: 18; }
.filter-btn { padding: 5px 13px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-size: 11px; font-weight: 600; transition: all 0.15s; white-space: nowrap; }
.filter-btn:hover { border-color: var(--accent); color: var(--accent); }
.filter-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.sep { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }
.spacer { flex: 1; }

/* ── Buttons ── */
.btn { padding: 7px 14px; border-radius: 6px; border: none; font-size: 12px; font-weight: 700; cursor: pointer; transition: opacity 0.15s; white-space: nowrap; }
.btn:hover { opacity: 0.85; }
.btn:disabled { opacity: 0.25; cursor: not-allowed; }
.btn-green  { background: var(--green);  color: #000; }
.btn-amber  { background: var(--amber);  color: #000; }
.btn-blue   { background: var(--blue);   color: #fff; }
.btn-purple { background: var(--purple); color: #fff; }
.btn-ghost  { background: transparent; border: 1px solid var(--border); color: var(--muted); }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn-sm { padding: 5px 10px; font-size: 11px; }

/* ── Grid ── */
.posts-grid { padding: 20px 28px; display: flex; flex-direction: column; gap: 10px; }

/* ── Card ── */
.post-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; transition: border-color 0.15s; }
.post-card.approved  { border-color: var(--blue); }
.post-card.img-ready { border-left: 3px solid var(--green); }
.post-card.generating { border-left: 3px solid var(--amber); }

.post-card-header { padding: 12px 16px; display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
.post-card-header:hover { background: rgba(255,255,255,0.025); }

.post-date { font-size: 11px; color: var(--muted); min-width: 82px; }
.post-product { font-size: 10px; font-weight: 800; letter-spacing: 0.08em; padding: 3px 7px; border-radius: 4px; text-transform: uppercase; flex-shrink: 0; }
.product-brand   { background: #1a1a2e; color: #818cf8; }
.product-gotcha  { background: #1a0a00; color: #fb923c; }
.product-wsup    { background: #001a0a; color: #4ade80; }
.product-ripple  { background: #00121a; color: #38bdf8; }
.product-frother { background: #1a001a; color: #e879f9; }

.post-preview { flex: 1; font-size: 12px; color: #999; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

/* Image status badges */
.img-badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 4px; white-space: nowrap; flex-shrink: 0; }
.img-needed    { background: #1a1000; color: var(--amber); }
.img-generating { background: #1a1000; color: #fbbf24; animation: pulse 1.5s ease-in-out infinite; }
.img-ready     { background: #001a08; color: var(--green); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }

/* Post status badges */
.status-badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 4px; white-space: nowrap; flex-shrink: 0; }
.status-draft          { background: #222; color: var(--muted); }
.status-image-needed   { background: #1a1000; color: var(--amber); }
.status-ready          { background: #001020; color: var(--blue); }
.status-approved       { background: #001020; color: #60a5fa; }
.status-scheduled      { background: #0f0020; color: var(--purple); }
.status-posted         { background: #1a1a1a; color: #555; }

/* Fast Track button */
.fast-track-btn { padding: 4px 10px; background: transparent; border: 1px solid #333; border-radius: 5px; font-size: 10px; font-weight: 800; color: var(--amber); cursor: pointer; transition: all 0.15s; flex-shrink: 0; letter-spacing: 0.04em; }
.fast-track-btn:hover { background: var(--amber); color: #000; border-color: var(--amber); }

.approve-toggle { width: 18px; height: 18px; border-radius: 4px; border: 2px solid var(--border); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; }
.approve-toggle.checked { background: var(--blue); border-color: var(--blue); }
.approve-toggle.checked::after { content: '✓'; color: #fff; font-size: 11px; font-weight: 800; }

.chevron { color: var(--muted); font-size: 9px; transition: transform 0.2s; flex-shrink: 0; }
.post-card.open .chevron { transform: rotate(180deg); }

/* Card body */
.post-card-body { display: none; padding: 0 16px 16px; border-top: 1px solid var(--border); }
.post-card.open .post-card-body { display: block; }

.field { margin-top: 12px; }
.field label { display: block; font-size: 10px; font-weight: 800; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; }
.field-content { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 9px 12px; font-size: 12px; line-height: 1.6; color: #ccc; }
.field-row { display: flex; gap: 6px; align-items: flex-start; }
.field-row .field-content { flex: 1; }

.copy-btn { padding: 7px 10px; background: transparent; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.15s; flex-shrink: 0; }
.copy-btn:hover { border-color: var(--accent); color: var(--accent); }
.copy-btn.copied { border-color: var(--green); color: var(--green); }

.gen-btn { padding: 7px 12px; background: var(--amber); color: #000; border: none; border-radius: 6px; font-size: 11px; font-weight: 800; cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: opacity 0.15s; }
.gen-btn:hover { opacity: 0.85; }
.gen-btn.generating { background: #2a1a00; color: var(--amber); border: 1px solid var(--amber); }

.field-inline { display: flex; gap: 12px; margin-top: 12px; }
.field-inline .field { flex: 1; margin-top: 0; }

.media-row { display: flex; gap: 6px; align-items: center; }
.media-input { flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--accent); padding: 8px 12px; border-radius: 6px; font-size: 12px; }
.media-input::placeholder { color: var(--muted); }
.mark-ready-btn { padding: 8px 12px; background: var(--green); color: #000; border: none; border-radius: 6px; font-size: 11px; font-weight: 800; cursor: pointer; white-space: nowrap; transition: opacity 0.15s; }
.mark-ready-btn:hover { opacity: 0.85; }

.select-row { display: flex; gap: 6px; }
select.status-select, select.img-status-select { background: var(--bg); border: 1px solid var(--border); color: var(--accent); padding: 7px 10px; border-radius: 6px; font-size: 12px; width: 100%; cursor: pointer; }

/* ── Toast ── */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--surface2); border: 1px solid var(--border); color: var(--accent); padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none; transition: all 0.25s; z-index: 99; white-space: nowrap; max-width: 90vw; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Empty ── */
.empty { text-align: center; padding: 60px 28px; color: var(--muted); }
footer { padding: 16px 28px; border-top: 1px solid var(--border); text-align: center; color: var(--muted); font-size: 11px; }
</style>
</head>
<body>

<header>
  <h1>ESO ES — AUTO POSTER</h1>
  <div class="header-actions">
    <button class="btn btn-ghost btn-sm" id="export-prompts-btn">Export Prompts CSV</button>
    <button class="btn btn-green btn-sm" id="export-buffer-btn" disabled>Export Approved → Buffer</button>
  </div>
</header>

<!-- Dashboard -->
<div class="dashboard">
  <div class="stat stat-posts">   <div class="stat-num" id="d-total">30</div>   <div class="stat-label">Posts</div></div>
  <div class="stat stat-ready">  <div class="stat-num" id="d-ready">0</div>    <div class="stat-label">Images Ready</div></div>
  <div class="stat stat-gen">    <div class="stat-num" id="d-gen">0</div>      <div class="stat-label">Generating</div></div>
  <div class="stat stat-approved"><div class="stat-num" id="d-approved">0</div><div class="stat-label">Approved</div></div>
  <div class="stat stat-sched">  <div class="stat-num" id="d-sched">0</div>   <div class="stat-label">Scheduled</div></div>
  <div class="stat stat-posted"> <div class="stat-num" id="d-posted">0</div>  <div class="stat-label">Posted</div></div>
</div>

<!-- Controls -->
<div class="controls">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="img:Image Needed">Image Needed</button>
  <button class="filter-btn" data-filter="img:Generating">Generating</button>
  <button class="filter-btn" data-filter="img:Image Ready">Image Ready</button>
  <button class="filter-btn" data-filter="Approved">Approved</button>
  <button class="filter-btn" data-filter="Scheduled">Scheduled</button>
  <button class="filter-btn" data-filter="Posted">Posted</button>
  <div class="sep"></div>
  <button class="btn btn-amber btn-sm" id="gen-next-10">⚡ Generate Next 10</button>
  <button class="btn btn-ghost btn-sm" id="gen-all-approved">Generate All Approved</button>
</div>

<div class="posts-grid" id="posts-grid"></div>
<div class="empty" id="empty-state" style="display:none">No posts match this filter.</div>

<div class="toast" id="toast"></div>
<footer>Eso Es Auto Poster v1 · State saved in browser · Export before closing</footer>

<script>

const SRC = [

  {id:3,  product:"WSUP",    day:"Wednesday", caption:"WSUP. Your morning handled. 💪",                                   hashtags:"#WSUP #EsoEs #MorningRoutine #CoffeeCulture",           image_prompt:"WSUP product in hand, active lifestyle setting. Clean white background. Morning energy.",                canva_template:"eso-es-product-square-v1"},
  {id:4,  product:"Ripple",  day:"Thursday",  caption:"Ripple. The wave you've been waiting for. 🌊",                     hashtags:"#Ripple #EsoEs #CoffeeWave #MorningVibes",              image_prompt:"Ripple product hero shot. Soft water texture background. Brand palette. Clean and bold.",                 canva_template:"eso-es-product-square-v1"},
  {id:5,  product:"Brand",   day:"Friday",    caption:"Local flavour. Global attitude. This is Eso Es. 🇦🇺",              hashtags:"#EsoEs #MadeLocal #AustraliaCoffee #Founder",           image_prompt:"Warm lifestyle shot. Local café context or founder presence. Authentic, not polished.",                   canva_template:"eso-es-founder-square-v1"},
  {id:6,  product:"Brand",   day:"Monday",    caption:"Something new is coming. Stay close. 👀",                          hashtags:"#EsoEs #ComingSoon #CoffeeDrop #Leak",                  image_prompt:"Dark teaser graphic. Blurred product silhouette. Question mark or shadow. High intrigue.",                canva_template:"eso-es-brand-square-v1"},
  {id:7,  product:"Gotcha",  day:"Tuesday",   caption:"One sip. That's all it takes. Gotcha. ☕",                         hashtags:"#Gotcha #EsoEs #FirstSip #CoffeeCulture",               image_prompt:"Close-up espresso pour or sip moment. Steam rising. Gotcha text overlay. Dark dramatic light.",           canva_template:"eso-es-product-square-v1"},
  {id:8,  product:"WSUP",    day:"Wednesday", caption:"Wednesday check in: WSUP? ✌️",                                     hashtags:"#WSUP #EsoEs #Midweek #WednesdayVibes",                 image_prompt:"WSUP flat lay. Casual midweek energy. Warm natural light. Relaxed but intentional.",                     canva_template:"eso-es-product-square-v1"},
  {id:9,  product:"Frother", day:"Thursday",  caption:"Froth it. Mean it. 🥛",                                            hashtags:"#Frother #EsoEs #MilkFrother #HomeCafé",                image_prompt:"Frother in action. Milk foam close-up. Warm kitchen light. Rich texture visible.",                       canva_template:"eso-es-product-square-v1"},
  {id:10, product:"Brand",   day:"Friday",    caption:"End of week, start of something good. Eso Es. 🖤",                 hashtags:"#EsoEs #FridayFeeling #WeekendCoffee #Local",           image_prompt:"End-of-week energy. Group or street scene with product. Warm golden hour tones.",                        canva_template:"eso-es-founder-square-v1"},
  {id:11, product:"Brand",   day:"Monday",    caption:"Not your average coffee brand. 🖤",                                hashtags:"#EsoEs #CoffeeNotCoffee #DifferentByDesign #Brand",     image_prompt:"Side-by-side: ordinary coffee vs Eso Es. Bold contrast. Clean layout. Statement energy.",                canva_template:"eso-es-brand-square-v1"},
  {id:12, product:"Gotcha",  day:"Tuesday",   caption:"The element of surprise, bottled. Gotcha by Eso Es. ☕",           hashtags:"#Gotcha #EsoEs #Surprise #CoffeeGame",                  image_prompt:"Gotcha product popping out of a bag or box. Surprise reveal angle. Playful energy.",                    canva_template:"eso-es-product-square-v1"},
  {id:13, product:"WSUP",    day:"Wednesday", caption:"Your mornings just got sorted. WSUP by Eso Es.",                  hashtags:"#WSUP #EsoEs #MorningSorted #CoffeeRoutine",            image_prompt:"Morning routine flat lay. WSUP product as hero item. Coffee, phone, keys. Clean tabletop.",               canva_template:"eso-es-product-square-v1"},
  {id:14, product:"Ripple",  day:"Thursday",  caption:"Ripple — every morning a little different. 🌊",                   hashtags:"#Ripple #EsoEs #MorningRipple #CoffeeMood",             image_prompt:"Ripple product with water droplet or ripple effect overlay. Clean and graphic. Brand colours.",           canva_template:"eso-es-product-square-v1"},
  {id:15, product:"Brand",   day:"Friday",    caption:"Behind every Eso Es product is a story. Come find ours. 🖤",      hashtags:"#EsoEs #OurStory #Founder #LocalBrand",                 image_prompt:"Founder working or behind the scenes. Raw, authentic. Not polished. Real environment.",                  canva_template:"eso-es-founder-square-v1"},
  {id:16, product:"Brand",   day:"Monday",    caption:"Built different. By design. 🖤",                                   hashtags:"#EsoEs #BuiltDifferent #ByDesign #CoffeeBrand",         image_prompt:"Abstract Eso Es logo treatment. Bold geometry. Dark background. Statement typography.",                   canva_template:"eso-es-brand-square-v1"},
  {id:17, product:"Gotcha",  day:"Tuesday",   caption:"You weren't ready. Gotcha. ☕",                                    hashtags:"#Gotcha #EsoEs #Unexpected #CoffeeAlert",               image_prompt:"Reaction shot concept — surprised face or dropped jaw. Gotcha logo large. Fun energy.",                  canva_template:"eso-es-product-square-v1"},
  {id:18, product:"WSUP",    day:"Wednesday", caption:"Early starter or slow mornings — WSUP has you. 💪",               hashtags:"#WSUP #EsoEs #EarlyMorning #SlowMorning",               image_prompt:"Split image — early gym vs slow Sunday bed. WSUP logo centred. Both moods served.",                       canva_template:"eso-es-product-square-v1"},
  {id:19, product:"Frother", day:"Thursday",  caption:"Café-quality froth at home. No excuses. 🥛",                      hashtags:"#Frother #EsoEs #HomeCafé #FrothGoals",                 image_prompt:"Latte art or frothed milk in a home mug. Frother product beside it. Aspirational but real.",             canva_template:"eso-es-product-square-v1"},
  {id:20, product:"Brand",   day:"Friday",    caption:"Made here. Meant for everywhere. Eso Es. 🇦🇺",                    hashtags:"#EsoEs #MadeHere #AustraliaMade #CoffeeForAll",         image_prompt:"Map graphic or Australian reference. Eso Es product over it. Pride and scale energy.",                   canva_template:"eso-es-founder-square-v1"},
  {id:21, product:"Brand",   day:"Monday",    caption:"Eso Es. The name says it all. 🖤",                                 hashtags:"#EsoEs #TheNameSaysItAll #CoffeeIdentity #Brand",       image_prompt:"Typography-led post. Eso Es in large bold type. Translated meaning as subtext. Minimal.",                canva_template:"eso-es-brand-square-v1"},
  {id:22, product:"Gotcha",  day:"Tuesday",   caption:"Bold. Unexpected. Gotcha. ☕",                                     hashtags:"#Gotcha #EsoEs #Bold #CoffeeBold",                      image_prompt:"Bold graphic — Gotcha text at maximum scale. Minimal product. Maximum confidence.",                       canva_template:"eso-es-product-square-v1"},
  {id:23, product:"WSUP",    day:"Wednesday", caption:"WSUP: Because mornings should work for you.",                     hashtags:"#WSUP #EsoEs #MorningRoutine #WorkForYou",              image_prompt:"Product beside a morning planner or to-do list. Organised energy. Clean light.",                          canva_template:"eso-es-product-square-v1"},
  {id:24, product:"Ripple",  day:"Thursday",  caption:"Ripple — the coffee that keeps moving. 🌊",                       hashtags:"#Ripple #EsoEs #KeepMoving #CoffeeFlow",                image_prompt:"Dynamic ripple product shot. Motion blur or layered effect. Energy and movement.",                        canva_template:"eso-es-product-square-v1"},
  {id:25, product:"Brand",   day:"Friday",    caption:"Friday feeling powered by Eso Es. 🙌",                            hashtags:"#EsoEs #FridayFuelled #WeekendReady #CoffeePowered",    image_prompt:"Celebration moment. Product in hand, high energy. Friday light. Authentic smile.",                        canva_template:"eso-es-founder-square-v1"},
  {id:26, product:"Brand",   day:"Monday",    caption:"Leak: something big is brewing at Eso Es. 👀",                   hashtags:"#EsoEs #Leak #ComingNext #CoffeeDrop",                  image_prompt:"Dark teaser. Partial product reveal. Heavy shadow. Curiosity and anticipation.",                          canva_template:"eso-es-brand-square-v1"},
  {id:27, product:"Gotcha",  day:"Tuesday",   caption:"Gotcha again. ☕ #noregrets",                                     hashtags:"#Gotcha #EsoEs #NoRegrets #CoffeeAgain",                image_prompt:"Second empty cup or repeat purchase visual. Humour. No regrets energy. Light tone.",                      canva_template:"eso-es-product-square-v1"},
  {id:28, product:"WSUP",    day:"Wednesday", caption:"The last Wednesday excuse. WSUP sorted your mornings. 💪",       hashtags:"#WSUP #EsoEs #NoMoreExcuses #MorningWin",               image_prompt:"Before/after concept. Tired morning vs powered morning. WSUP as the turning point.",                       canva_template:"eso-es-product-square-v1"},
  {id:29, product:"Frother", day:"Thursday",  caption:"Upgrade your ritual. Eso Es Frother. 🥛",                        hashtags:"#Frother #EsoEs #UpgradeYourRitual #CoffeeRitual",      image_prompt:"Ritual flat lay. Frother, quality milk, good mug. Morning ceremony feel. Quiet luxury.",                 canva_template:"eso-es-product-square-v1"},
  {id:30, product:"Brand",   day:"Friday",    caption:"This started local. It won't stay that way. Eso Es. 🖤",         hashtags:"#EsoEs #LocalToGlobal #AustraliaCoffee #Watch",         image_prompt:"Map or expansion graphic. Local pins radiating outward. Bold brand statement overlay.",                   canva_template:"eso-es-founder-square-v1"}
];

// ─── Schedule ─────────────────────────────────────────────────────────────────
function nextMonday(d) { const t=new Date(d), day=t.getDay(), diff=day===1?0:(8-day)%7||7; t.setDate(t.getDate()+diff); return t; }
function addDays(d,n) { const t=new Date(d); t.setDate(t.getDate()+n); return t; }
function isoDate(d) { return d.toISOString().split('T')[0]; }
function dispDate(d) { return d.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'}); }

const start = nextMonday(new Date());
const PLATFORMS = ['Instagram','Facebook'];
let posts = [];
let pi=0, wk=0;
while (pi < SRC.length) {
  for (const off of [0,1,2,3,4]) {
    if (pi >= SRC.length) break;
    const s = SRC[pi], dt = addDays(start, wk*7+off);
    for (const pl of PLATFORMS) {
      posts.push({ ...s, platform:pl, date:isoDate(dt), dateDisplay:dispDate(dt),
        time:'09:00', media_url:'', status:'Image Needed', imageStatus:'Image Needed',
        rowId:`${s.id}-${pl.toLowerCase()}` });
    }
    pi++;
  }
  wk++;
}

// ─── State ────────────────────────────────────────────────────────────────────
let state = posts.map(p=>({...p}));
let currentFilter = 'all';

function save() {
  try { localStorage.setItem('eso_posts_v2', JSON.stringify(
    state.map(({rowId,status,imageStatus,media_url})=>({rowId,status,imageStatus,media_url}))
  )); } catch(e){}
}
function load() {
  try {
    const saved = JSON.parse(localStorage.getItem('eso_posts_v2')||'[]');
    saved.forEach(s => { const p = state.find(x=>x.rowId===s.rowId); if(p){p.status=s.status;p.imageStatus=s.imageStatus;p.media_url=s.media_url||'';} });
  } catch(e){}
}

// ─── Unique by post id (for stats) ───────────────────────────────────────────
function uniq() { return SRC.map(s=>state.find(p=>p.id===s.id)); }

// ─── Dashboard ────────────────────────────────────────────────────────────────
function updateDash() {
  const u = uniq();
  document.getElementById('d-total').textContent   = u.length;
  document.getElementById('d-ready').textContent   = u.filter(p=>p.imageStatus==='Image Ready').length;
  document.getElementById('d-gen').textContent     = u.filter(p=>p.imageStatus==='Generating').length;
  document.getElementById('d-approved').textContent= u.filter(p=>p.status==='Approved').length;
  document.getElementById('d-sched').textContent   = u.filter(p=>p.status==='Scheduled').length;
  document.getElementById('d-posted').textContent  = u.filter(p=>p.status==='Posted').length;
  const approvedCount = u.filter(p=>p.status==='Approved').length;
  document.getElementById('export-buffer-btn').disabled = approvedCount===0;
}

// ─── Toast ────────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 3000);
}

// ─── Helpers ─────────────────────────────────────────────────────────────────
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function imgBadgeClass(s) { return s==='Generating'?'img-generating':s==='Image Ready'?'img-ready':'img-needed'; }
function statusClass(s) { return 'status-'+s.toLowerCase().replace(/\s+/g,'-'); }
function productClass(p) { return 'product-'+p.toLowerCase(); }
function cardClass(p) {
  let c = 'post-card';
  if (p.status==='Approved') c+=' approved';
  if (p.imageStatus==='Image Ready') c+=' img-ready';
  else if (p.imageStatus==='Generating') c+=' generating';
  return c;
}
const STATUSES = ['Draft','Image Needed','Ready','Approved','Scheduled','Posted'];
const IMG_STATUSES = ['Image Needed','Generating','Image Ready'];

// ─── Rendering ────────────────────────────────────────────────────────────────
function getFiltered() {
  const u = uniq();
  if (currentFilter === 'all') return u;
  if (currentFilter.startsWith('img:')) {
    const is = currentFilter.slice(4);
    return u.filter(p=>p.imageStatus===is);
  }
  return u.filter(p=>p.status===currentFilter);
}

function renderAll() {
  const grid = document.getElementById('posts-grid');
  const empty = document.getElementById('empty-state');
  const filtered = getFiltered();
  if (!filtered.length) { grid.innerHTML=''; empty.style.display='block'; }
  else { empty.style.display='none'; grid.innerHTML=filtered.map(renderCard).join(''); }
  updateDash();
  bindEvents();
}

function renderCard(p) {
  const open = document.querySelector(`.post-card[data-id="${p.id}"].open`) ? ' open' : '';
  return `
<div class="${cardClass(p)}${open}" data-id="${p.id}">
  <div class="post-card-header" data-toggle="${p.id}">
    <div class="post-date">${p.dateDisplay}</div>
    <span class="post-product ${productClass(p.product)}">${p.product}</span>
    <div class="post-preview">${esc(p.caption)}</div>
    <span class="img-badge ${imgBadgeClass(p.imageStatus)}">${p.imageStatus}</span>
    <span class="status-badge ${statusClass(p.status)}">${p.status}</span>
    <button class="fast-track-btn" data-ft="${p.id}" title="Fast Track: Approve + copy prompt">⚡ Fast Track</button>
    <div class="approve-toggle ${p.status==='Approved'?'checked':''}" data-approve="${p.id}"></div>
    <span class="chevron">▼</span>
  </div>
  <div class="post-card-body">
    <div class="field">
      <label>Caption</label>
      <div class="field-row">
        <div class="field-content">${esc(p.caption)}</div>
        <button class="copy-btn" data-copy="${esc(p.caption)}">Copy</button>
      </div>
    </div>
    <div class="field">
      <label>Hashtags</label>
      <div class="field-row">
        <div class="field-content">${esc(p.hashtags)}</div>
        <button class="copy-btn" data-copy="${esc(p.hashtags)}">Copy</button>
      </div>
    </div>
    <div class="field">
      <label>Canva / ChatGPT Prompt</label>
      <div class="field-row">
        <div class="field-content">${esc(p.image_prompt)}</div>
        <button class="copy-btn" data-copy="${esc(p.image_prompt)}">Copy</button>
        <button class="gen-btn ${p.imageStatus==='Generating'?'generating':''}" data-gen="${p.id}">
          ${p.imageStatus==='Generating'?'⏳ Generating…':'⚡ Generate Graphic'}
        </button>
      </div>
    </div>
    <div class="field">
      <label>Full Text (Caption + Hashtags)</label>
      <div class="field-row">
        <div class="field-content">${esc(p.caption+'\n\n'+p.hashtags)}</div>
        <button class="copy-btn" data-copy="${esc(p.caption+'\n\n'+p.hashtags)}">Copy All</button>
      </div>
    </div>
    <div class="field">
      <label>Image URL — paste when ready</label>
      <div class="media-row">
        <input class="media-input" type="text" placeholder="https://…" value="${esc(p.media_url||'')}" data-media="${p.id}" />
        <button class="mark-ready-btn" data-ready="${p.id}">✓ Mark Image Ready</button>
      </div>
    </div>
    <div class="field-inline">
      <div class="field">
        <label>Image Status</label>
        <select class="img-status-select" data-img-status="${p.id}">
          ${IMG_STATUSES.map(s=>`<option value="${s}"${p.imageStatus===s?' selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Post Status</label>
        <select class="status-select" data-status="${p.id}">
          ${STATUSES.map(s=>`<option value="${s}"${p.status===s?' selected':''}>${s}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="field">
      <label>Template · Platform · Date · Time</label>
      <div class="field-content">${esc(p.canva_template)} · ${p.platform} · ${p.date} · ${p.time} AEST</div>
    </div>
  </div>
</div>`;
}

// ─── Events ───────────────────────────────────────────────────────────────────
function bindEvents() {
  document.querySelectorAll('[data-toggle]').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('[data-approve],[data-ft],[data-gen],[data-ready],[data-copy],.mark-ready-btn,.gen-btn,.fast-track-btn')) return;
      el.closest('.post-card').classList.toggle('open');
    });
  });

  document.querySelectorAll('[data-approve]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const id = +el.dataset.approve;
      const cur = state.find(p=>p.id===id)?.status;
      const next = cur==='Approved' ? 'Ready' : 'Approved';
      state.filter(p=>p.id===id).forEach(p=>p.status=next);
      save(); renderAll();
    });
  });

  document.querySelectorAll('[data-ft]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const id = +el.dataset.ft;
      const p = state.find(x=>x.id===id);
      navigator.clipboard.writeText(p.image_prompt);
      state.filter(x=>x.id===id).forEach(x=>{ x.status='Approved'; x.imageStatus='Generating'; });
      save(); renderAll();
      toast(`⚡ Post ${id} approved · Prompt copied · Paste image URL when done`);
    });
  });

  document.querySelectorAll('[data-gen]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const id = +el.dataset.gen;
      const p = state.find(x=>x.id===id);
      navigator.clipboard.writeText(p.image_prompt);
      state.filter(x=>x.id===id).forEach(x=>x.imageStatus='Generating');
      save(); renderAll();
      toast(`Prompt copied for Post ${id} · Generate in Canva or ChatGPT · Paste URL back here`);
    });
  });

  document.querySelectorAll('[data-ready]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const id = +el.dataset.ready;
      const card = el.closest('.post-card');
      const urlInput = card.querySelector(`[data-media="${id}"]`);
      const url = urlInput?.value.trim() || '';
      state.filter(p=>p.id===id).forEach(p=>{
        p.imageStatus='Image Ready';
        p.media_url=url;
        if (['Image Needed','Draft','Generating'].includes(p.status)) p.status='Ready';
      });
      save(); renderAll();
      toast(`✓ Post ${id} image ready · Status → Ready`);
    });
  });

  document.querySelectorAll('[data-copy]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const text = btn.dataset.copy.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');
      navigator.clipboard.writeText(text).then(()=>{ btn.textContent='Copied!'; btn.classList.add('copied'); setTimeout(()=>{ btn.textContent=btn.dataset.copy.length>30?'Copy':'Copy'; btn.classList.remove('copied'); },1500); });
    });
  });

  document.querySelectorAll('[data-media]').forEach(el => {
    el.addEventListener('input', ()=>{ const id=+el.dataset.media; state.filter(p=>p.id===id).forEach(p=>p.media_url=el.value); save(); });
  });

  document.querySelectorAll('[data-img-status]').forEach(el => {
    el.addEventListener('change', ()=>{ const id=+el.dataset.imgStatus; state.filter(p=>p.id===id).forEach(p=>p.imageStatus=el.value); save(); renderAll(); });
  });

  document.querySelectorAll('[data-status]').forEach(el => {
    el.addEventListener('change', ()=>{ const id=+el.dataset.status; state.filter(p=>p.id===id).forEach(p=>p.status=el.value); save(); renderAll(); });
  });
}

// ─── Filter tabs ──────────────────────────────────────────────────────────────
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderAll();
  });
});

// ─── Bulk: Generate Next 10 ───────────────────────────────────────────────────
document.getElementById('gen-next-10').addEventListener('click', ()=>{
  const ids = [...new Set(state.filter(p=>p.imageStatus==='Image Needed').map(p=>p.id))].slice(0,10);
  if (!ids.length) { toast('No posts with Image Needed status'); return; }
  const text = ids.map((id,i)=>{
    const p = SRC.find(s=>s.id===id);
    return `POST ${String(i+1).padStart(2,'0')} — ${p.product.toUpperCase()} (Post ID ${id})\n${p.image_prompt}`;
  }).join('\n\n---\n\n');
  navigator.clipboard.writeText(text);
  state.filter(p=>ids.includes(p.id)).forEach(p=>p.imageStatus='Generating');
  save(); renderAll();
  toast(`⚡ ${ids.length} prompts copied · All marked Generating`);
});

// ─── Bulk: Generate All Approved ──────────────────────────────────────────────
document.getElementById('gen-all-approved').addEventListener('click', ()=>{
  const ids = [...new Set(state.filter(p=>p.status==='Approved'&&p.imageStatus!=='Image Ready').map(p=>p.id))];
  if (!ids.length) { toast('No approved posts need images'); return; }
  const text = ids.map((id,i)=>{
    const p = SRC.find(s=>s.id===id);
    return `POST ${String(i+1).padStart(2,'0')} — ${p.product.toUpperCase()} (Post ID ${id})\n${p.image_prompt}`;
  }).join('\n\n---\n\n');
  navigator.clipboard.writeText(text);
  state.filter(p=>ids.includes(p.id)&&p.imageStatus!=='Image Ready').forEach(p=>p.imageStatus='Generating');
  save(); renderAll();
  toast(`${ids.length} approved prompts copied · All marked Generating`);
});

// ─── Export: Prompts CSV ──────────────────────────────────────────────────────
document.getElementById('export-prompts-btn').addEventListener('click', ()=>{
  const header = 'post_id,product,title,canva_prompt';
  const rows = SRC.map(p=>[
    p.id, p.product,
    `"${p.caption.replace(/"/g,'""')}"`,
    `"${p.image_prompt.replace(/"/g,'""')}"`
  ].join(','));
  const csv = [header,...rows].join('\n');
  downloadFile(csv, `eso-es-prompts-${today()}.csv`, 'text/csv');
  toast('Prompts CSV downloaded');
});

// ─── Export: Buffer CSV ───────────────────────────────────────────────────────
document.getElementById('export-buffer-btn').addEventListener('click', ()=>{
  const approved = state.filter(p=>p.status==='Approved');
  if (!approved.length) return;
  const header = 'date,time,channel,text,media_url,status,product,image_prompt';
  const rows = approved.map(p=>{
    const text = `${p.caption}\n\n${p.hashtags}`;
    const ch = p.platform==='Instagram'?'Instagram - Eso Es':'Facebook - Eso Es';
    return [p.date,p.time,ch,`"${text.replace(/"/g,'""')}"`,p.media_url||'',p.status,p.product,`"${p.image_prompt.replace(/"/g,'""')}"`].join(',');
  });
  downloadFile([header,...rows].join('\n'), `eso-es-buffer-${today()}.csv`, 'text/csv');
  approved.forEach(p=>{ if(p.status==='Approved') p.status='Scheduled'; });
  save(); renderAll();
  toast(`Buffer CSV downloaded · ${approved.length} rows → Scheduled`);
});

function downloadFile(content, name, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content],{type}));
  a.download = name; a.click();
}
function today() { return new Date().toISOString().split('T')[0]; }

// ─── Init ─────────────────────────────────────────────────────────────────────
load();
renderAll();
</script>
</body>
</html>
